<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Protocol and POC status overview</title>
  <desc id="desc">Status board showing what is completed in the current POC and what remains for rollout.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fd}
      .panel{fill:#fff;stroke:#294f86;stroke-width:2}
      .h{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#132645}
      .t{font:600 20px Inter,Segoe UI,Arial,sans-serif;fill:#1c355f}
      .s{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#2b4066}
      .ok{fill:#e6f7ec;stroke:#2a8a4a;stroke-width:2}
      .wip{fill:#fff6e5;stroke:#b77a13;stroke-width:2}
      .x{fill:#f2f4f8;stroke:#76839a;stroke-width:2}
      .badge{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#10253f}
    </style>
  </defs>

  <rect class="bg" width="1280" height="800" rx="20"/>
  <text class="h" x="640" y="72" text-anchor="middle">One protocol • One POC implementation status</text>

  <rect class="panel" x="70" y="120" width="1140" height="610" rx="16"/>

  <rect class="ok" x="120" y="180" width="500" height="125" rx="12"/>
  <text class="t" x="150" y="228">✅ Request handling and fan-out</text>
  <text class="s" x="150" y="256">Gateway orchestration for high-assurance traffic.</text>

  <rect class="ok" x="120" y="335" width="500" height="125" rx="12"/>
  <text class="t" x="150" y="383">✅ Integrity and proof packaging</text>
  <text class="s" x="150" y="411">Quorum-backed responses with signed integrity context.</text>

  <rect class="ok" x="120" y="490" width="500" height="125" rx="12"/>
  <text class="t" x="150" y="538">✅ End-to-end protocol path</text>
  <text class="s" x="150" y="566">Request to response flow is represented in the POC.</text>

  <rect class="wip" x="660" y="180" width="500" height="125" rx="12"/>
  <text class="t" x="690" y="228">🟡 Production rollout hardening</text>
  <text class="s" x="690" y="256">Operational controls and staged expansion planning.</text>

  <rect class="wip" x="660" y="335" width="500" height="125" rx="12"/>
  <text class="t" x="690" y="383">🟡 Expanded ecosystem access</text>
  <text class="s" x="690" y="411">Partner onboarding through Blocksize access process.</text>

  <rect class="x" x="660" y="490" width="500" height="125" rx="12"/>
  <text class="t" x="690" y="538">⚪ Future protocol extensions</text>
  <text class="s" x="690" y="566">Optional enhancements beyond the v1 summary scope.</text>

  <text class="badge" x="640" y="690" text-anchor="middle">Communication focus: RPC that always works + requests of proven integrity</text>
</svg>
