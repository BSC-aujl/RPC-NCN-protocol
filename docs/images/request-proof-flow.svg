<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Request to proof flow</title>
  <desc id="desc">Flow from request submission to decentralized execution, quorum evaluation, proof packaging, and response delivery.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafe}
      .step{fill:#fff;stroke:#28508a;stroke-width:2}
      .n{fill:#1f4a84}
      .nt{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .t{font:600 20px Inter,Segoe UI,Arial,sans-serif;fill:#16284a}
      .s{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#2b3f64}
      .line{stroke:#2b5ca3;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .footer{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#1d3660}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b5ca3"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="820" rx="20"/>

  <g transform="translate(70,70)">
    <rect class="step" x="0" y="0" width="530" height="105" rx="12"/>
    <circle class="n" cx="46" cy="52" r="22"/><text class="nt" x="46" y="58" text-anchor="middle">1</text>
    <text class="t" x="86" y="46">Client sends RPC request</text>
    <text class="s" x="86" y="74">Gateway receives the request plus context metadata.</text>

    <path class="line" d="M265 105 L265 145"/>

    <rect class="step" x="0" y="145" width="530" height="105" rx="12"/>
    <circle class="n" cx="46" cy="197" r="22"/><text class="nt" x="46" y="203" text-anchor="middle">2</text>
    <text class="t" x="86" y="191">Gateway fans out to decentralized operators</text>
    <text class="s" x="86" y="219">Parallel paths maximize response availability.</text>

    <path class="line" d="M265 250 L265 290"/>

    <rect class="step" x="0" y="290" width="530" height="105" rx="12"/>
    <circle class="n" cx="46" cy="342" r="22"/><text class="nt" x="46" y="348" text-anchor="middle">3</text>
    <text class="t" x="86" y="336">Responses are compared</text>
    <text class="s" x="86" y="364">Stake-weighted agreement is evaluated.</text>
  </g>

  <g transform="translate(680,70)">
    <rect class="step" x="0" y="0" width="530" height="105" rx="12"/>
    <circle class="n" cx="46" cy="52" r="22"/><text class="nt" x="46" y="58" text-anchor="middle">4</text>
    <text class="t" x="86" y="46">Quorum decision</text>
    <text class="s" x="86" y="74">If quorum passes, integrity is cryptographically proven.</text>

    <path class="line" d="M265 105 L265 145"/>

    <rect class="step" x="0" y="145" width="530" height="105" rx="12"/>
    <circle class="n" cx="46" cy="197" r="22"/><text class="nt" x="46" y="203" text-anchor="middle">5</text>
    <text class="t" x="86" y="191">Fallback reliability path</text>
    <text class="s" x="86" y="219">Even without quorum, decentralization still drives response continuity.</text>

    <path class="line" d="M265 250 L265 290"/>

    <rect class="step" x="0" y="290" width="530" height="105" rx="12"/>
    <circle class="n" cx="46" cy="342" r="22"/><text class="nt" x="46" y="348" text-anchor="middle">6</text>
    <text class="t" x="86" y="336">Response is returned</text>
    <text class="s" x="86" y="364">Clients get availability first, with integrity when quorum is met.</text>
  </g>

  <text class="footer" x="640" y="760" text-anchor="middle">RPC-NCN: decentralized reliability + quorum-backed integrity</text>
</svg>
