<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Request to proof flow</title>
  <desc id="desc">Six-step sequence from user request through operator quorum, proof generation, and final response delivery.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafe}
      .step{fill:#fff;stroke:#28508a;stroke-width:2}
      .n{fill:#1f4a84}
      .nt{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .t{font:600 22px Inter,Segoe UI,Arial,sans-serif;fill:#16284a}
      .s{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#2b3f64}
      .line{stroke:#2b5ca3;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b5ca3"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" rx="20"/>

  <g transform="translate(70,70)">
    <rect class="step" x="0" y="0" width="520" height="90" rx="12"/>
    <circle class="n" cx="45" cy="45" r="22"/><text class="nt" x="45" y="51" text-anchor="middle">1</text>
    <text class="t" x="85" y="40">Client sends RPC request</text>
    <text class="s" x="85" y="67">Gateway receives request and request metadata.</text>

    <path class="line" d="M260 90 L260 125"/>

    <rect class="step" x="0" y="125" width="520" height="90" rx="12"/>
    <circle class="n" cx="45" cy="170" r="22"/><text class="nt" x="45" y="176" text-anchor="middle">2</text>
    <text class="t" x="85" y="165">Gateway fans out to operators</text>
    <text class="s" x="85" y="192">Parallel execution protects reliability and latency.</text>

    <path class="line" d="M260 215 L260 250"/>

    <rect class="step" x="0" y="250" width="520" height="90" rx="12"/>
    <circle class="n" cx="45" cy="295" r="22"/><text class="nt" x="45" y="301" text-anchor="middle">3</text>
    <text class="t" x="85" y="290">Responses are hashed and compared</text>
    <text class="s" x="85" y="317">Gateway computes stake-weighted agreement.</text>
  </g>

  <g transform="translate(690,70)">
    <rect class="step" x="0" y="0" width="520" height="90" rx="12"/>
    <circle class="n" cx="45" cy="45" r="22"/><text class="nt" x="45" y="51" text-anchor="middle">4</text>
    <text class="t" x="85" y="40">Quorum accepted (≥2/3 stake)</text>
    <text class="s" x="85" y="67">Only quorum-backed results can progress.</text>

    <path class="line" d="M260 90 L260 125"/>

    <rect class="step" x="0" y="125" width="520" height="90" rx="12"/>
    <circle class="n" cx="45" cy="170" r="22"/><text class="nt" x="45" y="176" text-anchor="middle">5</text>
    <text class="t" x="85" y="165">Proof package is assembled</text>
    <text class="s" x="85" y="192">Signatures + integrity metadata are attached.</text>

    <path class="line" d="M260 215 L260 250"/>

    <rect class="step" x="0" y="250" width="520" height="90" rx="12"/>
    <circle class="n" cx="45" cy="295" r="22"/><text class="nt" x="45" y="301" text-anchor="middle">6</text>
    <text class="t" x="85" y="290">Verified response is returned</text>
    <text class="s" x="85" y="317">User receives result plus proven-integrity context.</text>
  </g>

  <text class="t" x="640" y="690" text-anchor="middle">RPC-NCN flow: reliability first, integrity always attached</text>
</svg>
