<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">RPC-NCN system overview</title>
  <desc id="desc">Users send requests to the RPC-NCN gateway, which routes to decentralized operators, validates integrity, and records accountability on-chain.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}
      .card{fill:#fff;stroke:#23406b;stroke-width:2}
      .soft{fill:#edf3ff;stroke:#3b63a4;stroke-width:2}
      .txt{font:600 22px Inter,Segoe UI,Arial,sans-serif;fill:#13233f}
      .sub{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#243a60}
      .line{stroke:#214f93;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .note{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#0f2f5e}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#214f93"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760" rx="20"/>

  <rect class="card" x="70" y="240" width="270" height="180" rx="14"/>
  <text class="txt" x="205" y="300" text-anchor="middle">Users / Apps</text>
  <text class="sub" x="205" y="334" text-anchor="middle">companies needing reliable</text>
  <text class="sub" x="205" y="360" text-anchor="middle">and integrity-assured RPC</text>

  <rect class="soft" x="430" y="195" width="380" height="270" rx="16"/>
  <text class="txt" x="620" y="255" text-anchor="middle">RPC-NCN Gateway</text>
  <text class="sub" x="620" y="292" text-anchor="middle">routes each request</text>
  <text class="sub" x="620" y="318" text-anchor="middle">aggregates decentralized responses</text>
  <text class="sub" x="620" y="344" text-anchor="middle">accepts stake-weighted quorum</text>
  <text class="sub" x="620" y="370" text-anchor="middle">returns response with integrity context</text>

  <rect class="card" x="900" y="95" width="300" height="155" rx="14"/>
  <text class="txt" x="1050" y="152" text-anchor="middle">Operator Set</text>
  <text class="sub" x="1050" y="186" text-anchor="middle">independent execution paths</text>

  <rect class="card" x="900" y="300" width="300" height="155" rx="14"/>
  <text class="txt" x="1050" y="357" text-anchor="middle">Integrity Engine</text>
  <text class="sub" x="1050" y="391" text-anchor="middle">quorum + proof checks</text>

  <rect class="card" x="900" y="505" width="300" height="155" rx="14"/>
  <text class="txt" x="1050" y="562" text-anchor="middle">On-chain Records</text>
  <text class="sub" x="1050" y="596" text-anchor="middle">attestation accountability</text>

  <path class="line" d="M340 330 L430 330"/>
  <path class="line" d="M810 245 L900 172"/>
  <path class="line" d="M810 330 L900 377"/>
  <path class="line" d="M810 415 L900 582"/>

</svg>
