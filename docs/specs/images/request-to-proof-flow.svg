<svg width="1300" height="260" viewBox="0 0 1300 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Request to proof flow: client request, gateway fan-out, operator response, gateway consensus, interval attestations, and epoch finalization.">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fcd34d" />
    </marker>
  </defs>
  <rect x="30" y="80" width="160" height="70" rx="10" fill="#111827" stroke="#fcd34d" stroke-width="3" />
  <text x="110" y="115" font-family="'Inter', Arial, sans-serif" font-size="16" fill="#fdfdfd" text-anchor="middle" font-weight="600">Client request</text>
  <text x="110" y="135" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#d1d5db" text-anchor="middle">JSON-RPC call + metadata</text>

  <line x1="190" y1="115" x2="210" y2="115" stroke="#fcd34d" stroke-width="4" marker-end="url(#arrowhead)" />

  <rect x="220" y="60" width="170" height="110" rx="10" fill="#111827" stroke="#60a5fa" stroke-width="3" />
  <text x="305" y="110" font-family="'Inter', Arial, sans-serif" font-size="16" fill="#fdfdfd" text-anchor="middle" font-weight="600">Gateway fan-out</text>
  <text x="305" y="132" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#d1d5db" text-anchor="middle">Stake-aware routing to operators</text>

  <line x1="390" y1="110" x2="430" y2="110" stroke="#fcd34d" stroke-width="4" marker-end="url(#arrowhead)" />

  <rect x="450" y="40" width="180" height="150" rx="10" fill="#111827" stroke="#34d399" stroke-width="3" />
  <text x="540" y="95" font-family="'Inter', Arial, sans-serif" font-size="16" fill="#fdfdfd" text-anchor="middle" font-weight="600">Operators respond</text>
  <text x="540" y="118" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#d1d5db" text-anchor="middle">Signed response + interval hash</text>

  <line x1="630" y1="110" x2="670" y2="110" stroke="#fcd34d" stroke-width="4" marker-end="url(#arrowhead)" />

  <rect x="680" y="80" width="170" height="70" rx="10" fill="#111827" stroke="#f97316" stroke-width="3" />
  <text x="765" y="115" font-family="'Inter', Arial, sans-serif" font-size="16" fill="#fdfdfd" text-anchor="middle" font-weight="600">Gateway consensus</text>
  <text x="765" y="135" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#d1d5db" text-anchor="middle">Quorum hash & freshness</text>

  <line x1="850" y1="115" x2="890" y2="115" stroke="#fcd34d" stroke-width="4" marker-end="url(#arrowhead)" />

  <rect x="900" y="60" width="170" height="110" rx="10" fill="#111827" stroke="#a855f7" stroke-width="3" />
  <text x="985" y="95" font-family="'Inter', Arial, sans-serif" font-size="16" fill="#fdfdfd" text-anchor="middle" font-weight="600">Interval attestations</text>
  <text x="985" y="118" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#d1d5db" text-anchor="middle">Operators -> on-chain program</text>

  <line x1="1070" y1="110" x2="1090" y2="110" stroke="#fcd34d" stroke-width="4" marker-end="url(#arrowhead)" />

  <rect x="1110" y="80" width="160" height="70" rx="10" fill="#111827" stroke="#22c55e" stroke-width="3" />
  <text x="1190" y="115" font-family="'Inter', Arial, sans-serif" font-size="16" fill="#fdfdfd" text-anchor="middle" font-weight="600">Epoch finalization</text>
  <text x="1190" y="135" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#d1d5db" text-anchor="middle">Rewards, offenses, plus state</text>
</svg>
